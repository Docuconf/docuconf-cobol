name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly against docuconf-go main; push and pull_request use .github/docuconf-go.ref.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty means .github/docuconf-go.ref)
        required: false
        default: ""

# The docuconf CLI and the spec come from the docuconf-go commit that
# go.mod pins, so the tests run against the exec this SDK documents.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
          fetch-depth: 0
      - name: Check out the docuconf-go commit go.mod pins
        run: git -C docuconf-go checkout "$(sed -n 's/.*docuconf-go v0.0.0-[0-9]*-\([0-9a-f]*\)$/\1/p' go.mod)"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go.mod and .github/docuconf-go.ref pin the same docuconf-go
        run: scripts/check-docuconf-go-pin.sh
      - name: Install GnuCOBOL, libcrypto (for PAYHOOK) and cue
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol3 libssl-dev
          go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Build the docuconf CLI from docuconf-go
        working-directory: docuconf-go/cmd/docuconf
        run: go build -o "$RUNNER_TEMP/bin/docuconf" . && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and vet the generator
        run: |
          test -z "$(gofmt -l cmd internal copybooks tests)"
          go build ./...
          go vet ./...
      # Regenerates in place and compares with the committed files, ignoring
      # only metadata.generator.version, which release PRs bump.
      - name: Generated files are up to date
        run: |
          go run ./cmd/docuconf-cobol generate examples/orders/orders-config.cpy
          scripts/check-generated.sh examples/orders
      - name: Generator, loader and conformance tests
        env:
          DOCUCONF: ${{ runner.temp }}/bin/docuconf
          DOCUCONF_SPEC: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
        run: go test ./...
      - name: Run scripts/conformance.sh
        run: DOCUCONF_GO_DIR="$GITHUB_WORKSPACE/docuconf-go" scripts/conformance.sh
      - name: cue vet -c the example contract
        run: |
          mod="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$mod/"
          mkdir "$mod/orders"
          cp examples/orders/contract.cue "$mod/orders/"
          cd "$mod" && cue vet -c ./orders
      - name: Example smoke test
        env:
          DOCUCONF: ${{ runner.temp }}/bin/docuconf
        run: examples/orders/smoke.sh
      - name: Example config test
        env:
          DOCUCONF: ${{ runner.temp }}/bin/docuconf
        run: examples/orders/test-config.sh
