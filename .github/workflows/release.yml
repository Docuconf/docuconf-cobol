name: release

# Push a tag such as v0.1.0. The release job attaches docuconf-cobol binaries
# and SHA256SUMS to the GitHub release; the image job pushes the multi-arch
# image ghcr.io/docuconf/docuconf-cobol. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/s390x darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/docuconf-cobol_${GITHUB_REF_NAME}_${os}_${arch}${ext}" ./cmd/docuconf-cobol
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runs reuse the release and replace the assets.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # ghcr.io/docuconf/docuconf-cobol:<version> (and :latest for releases), the
  # generator on distroless for linux/amd64, arm64 and s390x. Independent of
  # the release job; uses only the workflow's GITHUB_TOKEN. See RELEASING.md.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/docuconf/docuconf-cobol
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=docuconf-cobol
            org.opencontainers.image.description=docuconf contracts and loaders for COBOL: the generator.
            org.opencontainers.image.source=https://github.com/docuconf/docuconf-cobol
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
